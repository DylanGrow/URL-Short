<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | SecureLink</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --text-color: #f3f4f6;
            --accent-glow: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.08);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 3rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            transition: all 0.3s ease;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.05);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border-left-color: #ffffff;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin: 0 auto 24px auto;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }
        p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 0;
            word-break: break-all;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        a:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader" class="spinner"></div>
        <h2 id="status">Redirecting you...</h2>
        <p id="sub-status">Verifying link destination</p>
    </div>
    <script>
        async function route() {
            const statusText = document.getElementById('status');
            const subStatusText = document.getElementById('sub-status');
            const loader = document.getElementById('loader');

            try {
                // Parse slug from URL path (e.g. /my-slug -> my-slug)
                const path = window.location.pathname;
                // Detect repository name context dynamically (e.g. /URL-Short/slug)
                const repoName = "/URL-Short"; 
                
                let slug = path;
                if (path.startsWith(repoName)) {
                    slug = path.substring(repoName.length);
                }
                slug = slug.replace(/^\/|\/$/g, '');

                if (!slug || slug === 'index.html') {
                    window.location.replace('./');
                    return;
                }

                // Fetch the static link database (heavily cached by CDN)
                const res = await fetch('./db.json');
                if (!res.ok) throw new Error('Database unavailable');
                const db = await res.json();

                if (db[slug]) {
                    const target = db[slug].url;
                    statusText.textContent = "Taking you to destination...";
                    subStatusText.textContent = target;
                    
                    // Instant redirection
                    window.location.replace(target);
                } else {
                    // Redirect back to main page if slug not found
                    loader.style.display = 'none';
                    statusText.textContent = "Link Not Found";
                    subStatusText.innerHTML = `This shortened link does not exist.<br><a href="./">Return to Dashboard</a>`;
                }
            } catch (e) {
                console.error(e);
                loader.style.display = 'none';
                statusText.textContent = "Redirection Failed";
                subStatusText.innerHTML = `An unexpected error occurred.<br><a href="./">Return to Dashboard</a>`;
            }
        }
        route();
    </script>
</body>
</html>
